# Netlify build for the CityPay Expo web app.
#
# The app config sets web.output = "static", so `expo export` prerenders one
# HTML file per route and Netlify serves them directly (no SPA redirect needed).
#
# The site is the FRONTEND ONLY. The NestJS backend in backend/ has to be hosted
# separately over HTTPS, and EXPO_PUBLIC_API_URL below must point at it, or every
# request fails with "No se pudo conectar con el servidor municipal".
#
# Required environment variables (Site configuration > Environment variables).
# They are inlined into the client bundle at build time, so they must be set
# before the build runs — and must never hold server-only secrets such as the
# Neon connection string or the Cloudinary API secret:
#   EXPO_PUBLIC_API_URL                     https URL of the deployed backend
#   EXPO_PUBLIC_FIREBASE_API_KEY
#   EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN
#   EXPO_PUBLIC_FIREBASE_PROJECT_ID
#   EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET
#   EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
#   EXPO_PUBLIC_FIREBASE_APP_ID
#   EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID
#   EXPO_PUBLIC_CLOUDINARY_CLOUD_NAME
#   EXPO_PUBLIC_CLOUDINARY_UPLOAD_PRESET

[build]
  command = "npx expo export --platform web"
  publish = "dist"

[build.environment]
  # Node 20 went end-of-life in April 2026; this matches backend/.node-version.
  NODE_VERSION = "24"

  # Every EXPO_PUBLIC_* value is inlined into dist/_expo/static/js/web/entry-*.js
  # by design, and Netlify's secrets scanner reads the generated build output, so
  # it would flag them and fail the deploy. These are client identifiers, not
  # credentials: a Firebase web API key identifies the project and does not grant
  # access — that is enforced by Firebase Security Rules and the authorised-domain
  # list. Do NOT mark any of them as "secret" in the Netlify UI either, because a
  # value marked secret that appears in the build output fails the build outright.
  #
  # This is the narrow, documented exception. Never reach for
  # SECRETS_SCAN_ENABLED = "false", which disables the protection for everything,
  # including values that really are secret.
  SECRETS_SCAN_OMIT_KEYS = "EXPO_PUBLIC_API_URL,EXPO_PUBLIC_FIREBASE_API_KEY,EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN,EXPO_PUBLIC_FIREBASE_PROJECT_ID,EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET,EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID,EXPO_PUBLIC_FIREBASE_APP_ID,EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID,EXPO_PUBLIC_CLOUDINARY_CLOUD_NAME,EXPO_PUBLIC_CLOUDINARY_UPLOAD_PRESET"

# Long-lived caching for the content-hashed bundles under _expo/static.
[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Safety net for any path without its own prerendered file. Unforced rules only
# apply when no static file matches, so the per-route HTML still wins.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
